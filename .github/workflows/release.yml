name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0 or leave empty to read package.json)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      should_release: ${{ steps.check_version.outputs.should_release }}
      version_tag: ${{ steps.check_version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve target version tag
        id: check_version
        uses: actions/github-script@v7
        with:
          script: |
            let tag = '';

            if (context.eventName === 'workflow_dispatch' && context.payload.inputs.version) {
              tag = context.payload.inputs.version.trim();
              if (!tag.startsWith('v')) tag = 'v' + tag;
            } else if (context.eventName === 'push' && context.ref.startsWith('refs/tags/v')) {
              tag = context.ref.replace('refs/tags/', '');
            } else {
              // Push to main: read version from package.json automatically
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              tag = 'v' + pkg.version;
            }

            // Check if release already exists for this tag
            let releaseExists = false;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              releaseExists = true;
            } catch (e) {
              releaseExists = false;
            }

            // If triggered by normal commit push to main, and this version is already released, skip
            if (context.eventName === 'push' && !context.ref.startsWith('refs/tags/') && releaseExists) {
              core.setOutput('should_release', 'false');
              core.info(`Version ${tag} is already released on GitHub. Skipping automatic release.`);
              return;
            }

            core.setOutput('should_release', 'true');
            core.setOutput('tag', tag);

      - name: Create or update GitHub Release
        id: create-release
        if: steps.check_version.outputs.should_release == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "${{ steps.check_version.outputs.tag }}";
            const cleanVersion = tag.replace(/^v/, '');

            const releaseBody = [
              "## AuthG " + tag,
              "",
              "AuthG is a lightweight, 100% offline desktop authenticator for Google Authenticator TOTP tokens, built natively in Rust and Tauri v2.",
              "",
              "### Binaries by Platform",
              "",
              "#### macOS",
              "- Apple Silicon (.dmg): `AuthG_" + cleanVersion + "_aarch64.dmg` (M1, M2, M3, M4)",
              "- Intel Mac (.dmg): `AuthG_" + cleanVersion + "_x64.dmg`",
              "- Compatibility: macOS 10.15 Catalina and later (including Sonoma & Sequoia)",
              "",
              "#### Windows",
              "- Windows Installer (.exe): `AuthG_" + cleanVersion + "_x64-setup.exe` (NSIS Installer)",
              "- Windows Package (.msi): `AuthG_" + cleanVersion + "_x64_en-US.msi` (MSI Installer)",
              "- Compatibility: Windows 10 and Windows 11 (64-bit)",
              "",
              "#### Linux",
              "- Debian / Ubuntu (.deb): `authg_" + cleanVersion + "_amd64.deb`",
              "- Standalone AppImage: `authg_" + cleanVersion + "_amd64.AppImage`",
              "- Dependencies: WebKitGTK 4.1 (`libwebkit2gtk-4.1-0`), `libayatana-appindicator3-1`",
              "",
              "### Cryptographic Verification",
              "",
              "All binaries are built directly from source via GitHub Actions. Compare SHA-256 checksums before installation.",
              "",
              "macOS / Linux verification:",
              "```bash",
              "shasum -a 256 <filename>",
              "```",
              "",
              "Windows PowerShell verification:",
              "```powershell",
              "Get-FileHash <filename> -Algorithm SHA256",
              "```",
              "",
              "### Security Architecture",
              "- Zero Network Telemetry: Completely offline without telemetry, cloud syncing, or background pings.",
              "- Strong Encryption: AES-256-GCM authenticated encryption with Argon2id key derivation and secure salt.",
              "- Memory Protection: Decrypted secrets are wiped immediately on drop (zeroize protection)."
            ].join("\n");

            let release;
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              release = existing.data;
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name: `AuthG ${tag}`,
                body: releaseBody,
                draft: false,
                prerelease: false
              });
            } catch (err) {
              const created = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `AuthG ${tag}`,
                body: releaseBody,
                draft: false,
                prerelease: false
              });
              release = created.data;
            }

            return release.id;

  build-tauri:
    needs: create-release
    if: needs.create-release.outputs.should_release == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'ubuntu-22.04'
            args: '--target x86_64-unknown-linux-gnu'
            target: 'x86_64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build and upload Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: ./
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
