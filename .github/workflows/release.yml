name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0 or leave empty to read package.json)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      should_release: ${{ steps.check_version.outputs.should_release }}
      version_tag: ${{ steps.check_version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve target version tag
        id: check_version
        uses: actions/github-script@v7
        with:
          script: |
            let tag = '';

            if (context.eventName === 'workflow_dispatch' && context.payload.inputs.version) {
              tag = context.payload.inputs.version.trim();
              if (!tag.startsWith('v')) tag = 'v' + tag;
            } else if (context.eventName === 'push' && context.ref.startsWith('refs/tags/v')) {
              tag = context.ref.replace('refs/tags/', '');
            } else {
              // Push to main: read version from package.json automatically
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              tag = 'v' + pkg.version;
            }

            // Check if release already exists for this tag
            let releaseExists = false;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              releaseExists = true;
            } catch (e) {
              releaseExists = false;
            }

            // If triggered by normal commit push to main, and this version is already released, skip
            if (context.eventName === 'push' && !context.ref.startsWith('refs/tags/') && releaseExists) {
              core.setOutput('should_release', 'false');
              core.info(`Version ${tag} is already released on GitHub. Skipping automatic release.`);
              return;
            }

            core.setOutput('should_release', 'true');
            core.setOutput('tag', tag);

      - name: Create or update GitHub Release
        id: create-release
        if: steps.check_version.outputs.should_release == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "${{ steps.check_version.outputs.tag }}";
            const cleanVersion = tag.replace(/^v/, '');

            const releaseBody = [
              "## Quick Download Guide",
              "",
              "If you are unsure which file to pick, use this guide or visit the official website: [authg.abhinavdhakal.com/download](https://authg.abhinavdhakal.com/download)",
              "",
              "| Your Operating System | Download Link | Notes |",
              "| :--- | :--- | :--- |",
              "| **macOS (Apple Silicon)** | **[Download for Mac (M1/M2/M3/M4)](https://github.com/abhidhakal/authg-app/releases/download/" + tag + "/AuthG_" + cleanVersion + "_aarch64.dmg)** | Recommended for all modern Macs |",
              "| **macOS (Intel)** | **[Download for Intel Mac](https://github.com/abhidhakal/authg-app/releases/download/" + tag + "/AuthG_" + cleanVersion + "_x64.dmg)** | For Macs with Intel processors |",
              "| **Windows 10 / 11** | **[Download for Windows (.exe)](https://github.com/abhidhakal/authg-app/releases/download/" + tag + "/AuthG_" + cleanVersion + "_x64-setup.exe)** | Standard installer for 64-bit Windows |",
              "| **Windows (MSI)** | **[Download Windows Package (.msi)](https://github.com/abhidhakal/authg-app/releases/download/" + tag + "/AuthG_" + cleanVersion + "_x64_en-US.msi)** | Enterprise / unattended installation |",
              "| **Linux (Ubuntu / Debian)** | **[Download Debian Package (.deb)](https://github.com/abhidhakal/authg-app/releases/download/" + tag + "/authg_" + cleanVersion + "_amd64.deb)** | For Ubuntu, Debian, Linux Mint |",
              "| **Linux (Standalone)** | **[Download AppImage](https://github.com/abhidhakal/authg-app/releases/download/" + tag + "/authg_" + cleanVersion + "_amd64.AppImage)** | Runs on most modern Linux distributions |",
              "",
              "---",
              "",
              "### What are the other files in Assets?",
              "- **.app.tar.gz files**: Internal package archives used by AuthG for automated background updates. You do not need to download these manually.",
              "- **.rpm file**: For Red Hat, Fedora, and openSUSE Linux users.",
              "",
              "---",
              "",
              "### Cryptographic Verification",
              "",
              "To verify SHA-256 checksums before installation:",
              "",
              "macOS / Linux terminal:",
              "```bash",
              "shasum -a 256 <filename>",
              "```",
              "",
              "Windows PowerShell:",
              "```powershell",
              "Get-FileHash <filename> -Algorithm SHA256",
              "```",
              "",
              "### Security Architecture",
              "- Zero Network Telemetry: Completely offline without telemetry, cloud syncing, or background pings.",
              "- Strong Encryption: AES-256-GCM authenticated encryption with Argon2id key derivation and secure salt.",
              "- Memory Protection: Decrypted secrets are wiped immediately on drop (zeroize protection)."
            ].join("\n");

            let release;
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              release = existing.data;
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name: `AuthG ${tag}`,
                body: releaseBody,
                draft: false,
                prerelease: false
              });
            } catch (err) {
              const created = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `AuthG ${tag}`,
                body: releaseBody,
                draft: false,
                prerelease: false
              });
              release = created.data;
            }

            return release.id;

  build-tauri:
    needs: create-release
    if: needs.create-release.outputs.should_release == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'ubuntu-22.04'
            args: '--target x86_64-unknown-linux-gnu'
            target: 'x86_64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build and upload Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: ./
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
