name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      version_tag: ${{ steps.tag_name.outputs.TAG }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine tag name
        id: tag_name
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "${{ steps.tag_name.outputs.TAG }}";
            const cleanVersion = tag.replace(/^v/, '');
            
            const releaseBody = [
              "## AuthG " + tag,
              "",
              "AuthG is a lightweight, 100% offline desktop authenticator for Google Authenticator TOTP tokens, built natively in Rust and Tauri v2.",
              "",
              "### Binaries by Platform",
              "",
              "#### macOS",
              "- Apple Silicon (.dmg): `AuthG_" + cleanVersion + "_aarch64.dmg` (M1, M2, M3, M4)",
              "- Intel Mac (.dmg): `AuthG_" + cleanVersion + "_x64.dmg`",
              "- Compatibility: macOS 10.15 Catalina and later (including Sonoma & Sequoia)",
              "",
              "#### Windows",
              "- Windows Installer (.exe): `AuthG_" + cleanVersion + "_x64-setup.exe` (NSIS Installer)",
              "- Windows Package (.msi): `AuthG_" + cleanVersion + "_x64_en-US.msi` (MSI Installer)",
              "- Compatibility: Windows 10 and Windows 11 (64-bit)",
              "",
              "#### Linux",
              "- Debian / Ubuntu (.deb): `authg_" + cleanVersion + "_amd64.deb`",
              "- Standalone AppImage: `authg_" + cleanVersion + "_amd64.AppImage`",
              "- Dependencies: WebKitGTK 4.1 (`libwebkit2gtk-4.1-0`), `libayatana-appindicator3-1`",
              "",
              "### Cryptographic Verification",
              "",
              "All binaries are built directly from source via GitHub Actions. Compare SHA-256 checksums before installation.",
              "",
              "macOS / Linux verification:",
              "```bash",
              "shasum -a 256 <filename>",
              "```",
              "",
              "Windows PowerShell verification:",
              "```powershell",
              "Get-FileHash <filename> -Algorithm SHA256",
              "```",
              "",
              "### Security Architecture",
              "- Zero Network Telemetry: Completely offline without telemetry, cloud syncing, or background pings.",
              "- Strong Encryption: AES-256-GCM authenticated encryption with Argon2id key derivation and secure salt.",
              "- Memory Protection: Decrypted secrets are wiped immediately on drop (zeroize protection)."
            ].join("\n");

            // Check if release already exists for this tag
            let release;
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              release = existing.data;
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name: `AuthG ${tag}`,
                body: releaseBody,
                draft: false,
                prerelease: false
              });
            } catch (err) {
              const created = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `AuthG ${tag}`,
                body: releaseBody,
                draft: false,
                prerelease: false
              });
              release = created.data;
            }

            return release.id;

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'ubuntu-22.04'
            args: '--target x86_64-unknown-linux-gnu'
            target: 'x86_64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build and upload Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: ./
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
